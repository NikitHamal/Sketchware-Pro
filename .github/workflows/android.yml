name: Android CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'public-stable-ids.txt'
      - 'settings.gradle'
    branches-ignore:
      - 'wip/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ${{ vars.IS_USING_HOSTED_RUNNERS == 'true' && 'self-hosted' || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set environmental variables
        shell: bash
        env:
          JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: ${{ env.JSON_CONTENT != '' }}
        run: |
          printf '%s\n' 'GOOGLE_SERVICES_JSON<<EOF' >> "$GITHUB_ENV"
          printf '%s\n' "$JSON_CONTENT" >> "$GITHUB_ENV"
          printf '%s\n' 'EOF' >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Compute artifact name
        id: artifact_meta
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          apk_path="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$apk_path" ]; then
            echo "No release APK was produced." >&2
            exit 1
          fi
          artifact_path="app/build/outputs/apk/release/Sketchware-Pro-${short_sha}.apk"
          mv "$apk_path" "$artifact_path"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_path=$artifact_path" >> "$GITHUB_OUTPUT"

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: apk-release-${{ steps.artifact_meta.outputs.short_sha }}
          path: ${{ steps.artifact_meta.outputs.artifact_path }}
          if-no-files-found: error
