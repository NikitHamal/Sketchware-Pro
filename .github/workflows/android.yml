name: Android CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'public-stable-ids.txt'
      - 'settings.gradle'
    branches-ignore:
      - 'wip/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APKs
    runs-on: ${{ vars.IS_USING_HOSTED_RUNNERS == 'true' && 'self-hosted' || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set environmental variables
        shell: bash
        env:
          JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: ${{ env.JSON_CONTENT != '' }}
        run: |
          printf '%s\n' 'GOOGLE_SERVICES_JSON<<EOF' >> "$GITHUB_ENV"
          printf '%s\n' "$JSON_CONTENT" >> "$GITHUB_ENV"
          printf '%s\n' 'EOF' >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Build release APKs (android26 + android33)
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename and collect APKs
        id: artifact_meta
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"

          # Find android26 APK
          apk26="$(find app/build/outputs/apk -path '*/android26/release/*.apk' | head -n 1)"
          if [ -z "$apk26" ]; then
            # Fallback: look for release directory with android26 in name
            apk26="$(find app/build/outputs/apk -name '*android26*.apk' | head -n 1)"
          fi
          if [ -n "$apk26" ]; then
            artifact26="app/build/outputs/apk/Sketchware-Pro-android26-${short_sha}.apk"
            mv "$apk26" "$artifact26"
            echo "apk26_path=$artifact26" >> "$GITHUB_OUTPUT"
            echo "apk26_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "apk26_found=false" >> "$GITHUB_OUTPUT"
          fi

          # Find android33 APK
          apk33="$(find app/build/outputs/apk -path '*/android33/release/*.apk' | head -n 1)"
          if [ -z "$apk33" ]; then
            # Fallback: look for release directory with android33 in name
            apk33="$(find app/build/outputs/apk -name '*android33*.apk' | head -n 1)"
          fi
          if [ -n "$apk33" ]; then
            artifact33="app/build/outputs/apk/Sketchware-Pro-android33-${short_sha}.apk"
            mv "$apk33" "$artifact33"
            echo "apk33_path=$artifact33" >> "$GITHUB_OUTPUT"
            echo "apk33_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "apk33_found=false" >> "$GITHUB_OUTPUT"
          fi

          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Upload android26 APK
        if: steps.artifact_meta.outputs.apk26_found == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: apk-release-android26-${{ steps.artifact_meta.outputs.short_sha }}
          path: ${{ steps.artifact_meta.outputs.apk26_path }}
          if-no-files-found: error

      - name: Upload android33 APK
        if: steps.artifact_meta.outputs.apk33_found == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: apk-release-android33-${{ steps.artifact_meta.outputs.short_sha }}
          path: ${{ steps.artifact_meta.outputs.apk33_path }}
          if-no-files-found: error
